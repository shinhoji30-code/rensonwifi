<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renson Ecopark WiFi Hotspot</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4769997927752479"
         crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Renson Ecopark</h1>
            <p class="subtitle">Free WiFi Hotspot</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Advertisement Section 1 -->
            <div class="ad-container top-ad">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-4769997927752479"
                     data-ad-slot="1234567890"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>

            <!-- Video Timer Section -->
            <section class="video-section">
                <h2>Watch this short video to continue</h2>
                <div class="video-container">
                    <video id="adVideo" width="100%" height="auto" controls>
                        <source src="path/to/your/video.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="timer-section">
                    <p>Video Timer: <span id="timer">0:00</span> / <span id="duration">0:00</span></p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </section>

            <!-- Advertisement Section 2 -->
            <div class="ad-container middle-ad">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-4769997927752479"
                     data-ad-slot="2345678901"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>

            <!-- Login Section -->
            <section class="login-section">
                <h2>Connect to WiFi</h2>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn" disabled>Connect to WiFi</button>
                </form>
                <p class="login-note">Complete the video to enable login</p>
            </section>

            <!-- Advertisement Section 3 -->
            <div class="ad-container bottom-ad">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-4769997927752479"
                     data-ad-slot="3456789012"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Renson Ecopark. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
